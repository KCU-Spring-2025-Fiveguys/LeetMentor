<!DOCTYPE html>
<html>
  <head>
    <title>LeetMentor</title>
    <link rel="stylesheet" href="popup.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1>Welcome to LeetMentor!</h1>
      <div class="info">
        <p>Get hints, follow-ups and improvements for LeetCode problems</p>
      </div>

      <div class="scheduler">
        <h2>Reminder Schedule</h2>

        <!-- Recurring day selector -->
        <div class="days-selector">
          <p class="selector-label">Repeat on:</p>
          <div class="day-buttons">
            <button
              type="button"
              class="day-btn"
              data-day="0"
              aria-pressed="false"
            >
              Sun
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="1"
              aria-pressed="false"
            >
              Mon
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="2"
              aria-pressed="false"
            >
              Tue
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="3"
              aria-pressed="false"
            >
              Wed
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="4"
              aria-pressed="false"
            >
              Thu
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="5"
              aria-pressed="false"
            >
              Fri
            </button>
            <button
              type="button"
              class="day-btn"
              data-day="6"
              aria-pressed="false"
            >
              Sat
            </button>
          </div>
        </div>

        <!-- Time selection -->
        <div class="form-group">
          <label for="reminder-time">Time:</label>
          <div class="input-with-icon">
            <input type="time" id="reminder-time" name="reminder-time" />
          </div>
        </div>

        <!-- Action button -->
        <button id="save-reminder" aria-live="polite">
          <i class="fa-solid fa-bell"></i>
          <span>Schedule Reminder</span>
        </button>
        <div id="status-message" aria-live="polite"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
